<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blue 경로 리디렉션</title>
    <style>
      :root {
        --accent: #1c66ab;
        --accent-soft: #d2e3f5;
        --surface: #f4f9ff;
        --panel-start: #1c66ab;
        --panel-end: #5aa5ec;
      }

      body {
        margin: 0;
        padding: 28px 20px;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: linear-gradient(180deg, #eef5ff 0%, #f7fbff 100%);
        color: #1a1d24;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid var(--accent-soft);
        border-radius: 16px;
        padding: 22px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        color: var(--accent);
      }

      p {
        margin: 10px 0 0;
        line-height: 1.6;
      }

      .platform-note {
        margin-top: 10px;
        color: #8b4a00;
        font-weight: 700;
      }

      code {
        display: block;
        margin-top: 10px;
        padding: 12px;
        border-radius: 10px;
        background: #f1f6fd;
        font-family: "JetBrains Mono", "Consolas", monospace;
        font-size: 13px;
        word-break: break-all;
      }

      a {
        display: inline-block;
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        background: var(--accent);
        color: #ffffff;
        font-weight: 700;
      }

      .ios-data-panel {
        margin-top: 16px;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid var(--accent-soft);
        background: var(--surface);
      }

      .ios-data-panel h2 {
        margin: 0;
        font-size: 17px;
      }

      .ios-data-panel p {
        margin-top: 8px;
      }

      .ios-visual-panel {
        margin-top: 12px;
        padding: 18px 14px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--panel-start) 0%, var(--panel-end) 100%);
        display: grid;
        justify-items: center;
        row-gap: 6px;
        color: #ffffff;
      }

      .panel-key {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        font-size: 12px;
        font-weight: 700;
      }

      .panel-text {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .panel-number {
        font-size: 72px;
        font-weight: 900;
        line-height: 1;
      }

      .ios-data-sections {
        margin-top: 12px;
        display: grid;
        gap: 10px;
      }

      .data-placeholder {
        margin: 0;
        color: #7b5f5f;
      }

      .data-section {
        background: #ffffff;
        border: 1px solid var(--accent-soft);
        border-radius: 10px;
        padding: 10px 12px;
      }

      .data-section h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--accent);
      }

      .data-row {
        display: grid;
        grid-template-columns: minmax(130px, 180px) 1fr;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px dashed var(--accent-soft);
      }

      .data-row:last-child {
        border-bottom: none;
      }

      .data-label {
        font-weight: 700;
        color: #23466f;
      }

      .data-value {
        color: #232323;
        word-break: break-word;
        white-space: pre-wrap;
      }

      @media (max-width: 640px) {
        main {
          padding: 18px;
        }

        .panel-number {
          font-size: 60px;
        }

        .data-row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>/app-ddl-test/link/blue 리디렉션 페이지</h1>
      <p>앱링크 파라미터를 설치 리퍼러로 전달한 뒤 구글 플레이로 이동합니다.</p>
      <p id="platformNotice" class="platform-note"></p>
      <p id="referrerText"></p>
      <code id="playUrl"></code>
      <a id="manualLink" href="#">구글 플레이로 바로 이동</a>

      <section id="iosDataPanel" class="ios-data-panel" hidden>
        <h2>iOS 수집/저장 데이터</h2>
        <p id="iosDataSummary"></p>
        <p id="iosDataDocId"></p>
        <div id="iosVisualPanel" class="ios-visual-panel" hidden>
          <span class="panel-key">text</span>
          <span id="iosPanelText" class="panel-text">-</span>
          <span class="panel-key">number</span>
          <span id="iosPanelNumber" class="panel-number">-</span>
        </div>
        <div id="iosDataSections" class="ios-data-sections">
          <p class="data-placeholder">수집 대기 중...</p>
        </div>
      </section>
    </main>

    <script type="module">
      import {
        buildHumanReadablePayload,
        extractPayloadFromSaveError,
        extractBusinessParams,
        getErrorMessage,
        isAndroidBrowser,
        isIOSBrowser,
        saveWebToIosCandidate
      } from "../common/web-to-ios-firestore.js";

      const defaults = { text: "blue", number: "1" };
      const businessParams = extractBusinessParams(defaults);
      const playUrl =
        `https://play.google.com/store/apps/details?id=dev.sample.appddlink&referrer=${encodeURIComponent(businessParams.referrerRaw)}`;

      const platformNotice = document.getElementById("platformNotice");
      const iosDataPanel = document.getElementById("iosDataPanel");
      const iosDataSummary = document.getElementById("iosDataSummary");
      const iosDataDocId = document.getElementById("iosDataDocId");
      const iosVisualPanel = document.getElementById("iosVisualPanel");
      const iosPanelText = document.getElementById("iosPanelText");
      const iosPanelNumber = document.getElementById("iosPanelNumber");
      const iosDataSections = document.getElementById("iosDataSections");
      document.getElementById("referrerText").textContent = `전달되는 referrer: ${businessParams.referrerRaw}`;
      document.getElementById("playUrl").textContent = playUrl;
      document.getElementById("manualLink").href = playUrl;

      function renderRows(section, container) {
        const sectionElement = document.createElement("section");
        sectionElement.className = "data-section";
        const titleElement = document.createElement("h3");
        titleElement.textContent = section.title;
        sectionElement.appendChild(titleElement);

        section.rows.forEach((row) => {
          const rowElement = document.createElement("div");
          rowElement.className = "data-row";

          const labelElement = document.createElement("div");
          labelElement.className = "data-label";
          labelElement.textContent = row.label;

          const valueElement = document.createElement("div");
          valueElement.className = "data-value";
          valueElement.textContent = row.value;

          rowElement.append(labelElement, valueElement);
          sectionElement.appendChild(rowElement);
        });

        container.appendChild(sectionElement);
      }

      function renderIosPayload(payload, docId = null) {
        const readablePayload = buildHumanReadablePayload(payload, docId);
        iosVisualPanel.hidden = false;
        iosPanelText.textContent = readablePayload.panel.text;
        iosPanelNumber.textContent = readablePayload.panel.number;

        iosDataSections.replaceChildren();
        readablePayload.sections.forEach((section) => {
          renderRows(section, iosDataSections);
        });
      }

      function renderFallbackMessage(message) {
        iosVisualPanel.hidden = true;
        iosDataSections.replaceChildren();
        const placeholder = document.createElement("p");
        placeholder.className = "data-placeholder";
        placeholder.textContent = message;
        iosDataSections.appendChild(placeholder);
      }

      const isIOS = isIOSBrowser();
      const isAndroid = isAndroidBrowser();

      if (isIOS) {
        iosDataPanel.hidden = false;
        platformNotice.textContent =
          "iOS 브라우저입니다. 자동 리디렉션하지 않으며, 아래에 사용자 유추/저장 데이터를 표시합니다.";
        iosDataSummary.textContent = "Firestore 저장 시도 중...";
        iosDataDocId.textContent = "docId: (저장 중)";
        renderFallbackMessage("데이터 수집 중...");

        saveWebToIosCandidate({
          linkColor: defaults.text,
          businessParams
        })
          .then(({ docId, payloadForDisplay }) => {
            platformNotice.textContent =
              `iOS 브라우저입니다. Firestore 저장 완료(docId: ${docId}).`;
            iosDataSummary.textContent = "Firestore 저장 성공";
            iosDataDocId.textContent = `docId: ${docId}`;
            renderIosPayload(payloadForDisplay, docId);
          })
          .catch((error) => {
            console.error("[web-to-ios] blue save failed:", error);
            const payload = extractPayloadFromSaveError(error);
            const message = getErrorMessage(error);
            platformNotice.textContent =
              "iOS 브라우저입니다. Firestore 저장에 실패했습니다.";
            iosDataSummary.textContent = `Firestore 저장 실패: ${message}`;
            iosDataDocId.textContent = "docId: (없음)";
            if (payload) {
              renderIosPayload(payload);
            } else {
              renderFallbackMessage(`표시 가능한 데이터가 없습니다. (${message})`);
            }
          });
      } else if (isAndroid) {
        iosDataPanel.hidden = true;
        platformNotice.textContent = "안드로이드 브라우저입니다. 잠시 후 구글 플레이로 자동 이동합니다.";
        setTimeout(() => {
          window.location.replace(playUrl);
        }, 0);
      } else {
        iosDataPanel.hidden = true;
        platformNotice.textContent =
          "이 브라우저는 자동 리디렉션과 사용자 유추 데이터 수집을 수행하지 않습니다.";
      }
    </script>
  </body>
</html>
