<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Green 경로 리디렉션</title>
    <style>
      body {
        margin: 0;
        padding: 28px 20px;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        background: linear-gradient(180deg, #eefdf2 0%, #f7fff9 100%);
        color: #1a1d24;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #d4ecd7;
        border-radius: 16px;
        padding: 22px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        color: #1e7a3f;
      }

      p {
        margin: 10px 0 0;
        line-height: 1.6;
      }

      .platform-note {
        margin-top: 10px;
        color: #8b4a00;
        font-weight: 700;
      }

      code {
        display: block;
        margin-top: 10px;
        padding: 12px;
        border-radius: 10px;
        background: #f1f8f2;
        font-family: "JetBrains Mono", "Consolas", monospace;
        font-size: 13px;
        word-break: break-all;
      }

      a {
        display: inline-block;
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        background: #1e7a3f;
        color: #ffffff;
        font-weight: 700;
      }

      .ios-data-panel {
        margin-top: 16px;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #d4ecd7;
        background: #f4fff6;
      }

      .ios-data-panel h2 {
        margin: 0;
        font-size: 17px;
      }

      .ios-data-panel p {
        margin-top: 8px;
      }

      .ios-data-panel pre {
        margin: 10px 0 0;
        max-height: 360px;
        overflow: auto;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #d4ecd7;
        background: #fcfffc;
        font-family: "JetBrains Mono", "Consolas", monospace;
        font-size: 12px;
        line-height: 1.55;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>/app-ddl-test/link/green 리디렉션 페이지</h1>
      <p>앱링크 파라미터를 설치 리퍼러로 전달한 뒤 구글 플레이로 이동합니다.</p>
      <p id="platformNotice" class="platform-note"></p>
      <p id="referrerText"></p>
      <code id="playUrl"></code>
      <a id="manualLink" href="#">구글 플레이로 바로 이동</a>

      <section id="iosDataPanel" class="ios-data-panel" hidden>
        <h2>iOS 수집/저장 데이터</h2>
        <p id="iosDataSummary"></p>
        <p id="iosDataDocId"></p>
        <pre id="iosDataJson">수집 대기 중...</pre>
      </section>
    </main>

    <script type="module">
      import {
        extractPayloadFromSaveError,
        extractBusinessParams,
        formatPayloadForDisplay,
        getErrorMessage,
        isIOSBrowser,
        saveWebToIosCandidate
      } from "../common/web-to-ios-firestore.js";

      const defaults = { text: "green", number: "1" };
      const businessParams = extractBusinessParams(defaults);
      const playUrl =
        `https://play.google.com/store/apps/details?id=dev.sample.appddlink&referrer=${encodeURIComponent(businessParams.referrerRaw)}`;

      const platformNotice = document.getElementById("platformNotice");
      const iosDataPanel = document.getElementById("iosDataPanel");
      const iosDataSummary = document.getElementById("iosDataSummary");
      const iosDataDocId = document.getElementById("iosDataDocId");
      const iosDataJson = document.getElementById("iosDataJson");
      document.getElementById("referrerText").textContent = `전달되는 referrer: ${businessParams.referrerRaw}`;
      document.getElementById("playUrl").textContent = playUrl;
      document.getElementById("manualLink").href = playUrl;

      function renderIosPayload(payload) {
        iosDataJson.textContent = JSON.stringify(payload, null, 2);
      }

      if (isIOSBrowser()) {
        iosDataPanel.hidden = false;
        platformNotice.textContent =
          "iOS 브라우저입니다. 자동 리디렉션하지 않으며, 아래에 사용자 유추/저장 데이터를 표시합니다.";
        iosDataSummary.textContent = "Firestore 저장 시도 중...";
        iosDataDocId.textContent = "docId: (저장 중)";
        iosDataJson.textContent = "데이터 수집 중...";

        saveWebToIosCandidate({
          linkColor: defaults.text,
          businessParams
        })
          .then(({ docId, payloadForDisplay }) => {
            const payload = formatPayloadForDisplay(payloadForDisplay, docId);
            platformNotice.textContent =
              `iOS 브라우저입니다. Firestore 저장 완료(docId: ${docId}).`;
            iosDataSummary.textContent = "Firestore 저장 성공";
            iosDataDocId.textContent = `docId: ${docId}`;
            renderIosPayload(payload);
          })
          .catch((error) => {
            console.error("[web-to-ios] green save failed:", error);
            const payload = extractPayloadFromSaveError(error);
            const message = getErrorMessage(error);
            platformNotice.textContent =
              "iOS 브라우저입니다. Firestore 저장에 실패했습니다.";
            iosDataSummary.textContent = `Firestore 저장 실패: ${message}`;
            iosDataDocId.textContent = "docId: (없음)";
            if (payload) {
              renderIosPayload(formatPayloadForDisplay(payload));
            } else {
              iosDataJson.textContent = JSON.stringify(
                { error: "Firestore 저장 실패", message },
                null,
                2
              );
            }
          });
      } else {
        iosDataPanel.hidden = true;
        platformNotice.textContent = "잠시 후 구글 플레이로 자동 이동합니다.";
        setTimeout(() => {
          window.location.replace(playUrl);
        }, 0);
      }
    </script>
  </body>
</html>
